const KEY='cn_simple_checklist_v1';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read73G(){try{const u=JSON.parse(localStorage.getItem('cn_fault_units')||'{}');const v=JSON.parse(localStorage.getItem('cn_fault_vehicle_numbers')||'{}');return {units:u||{},vehicles:v||{}}}catch{return {units:{},vehicles:{}}}}
const stored73G=read73G();
const defaultData=()=>({customVehicles:[],projects:['MOPS更新','組態更新'],cars:CARS.map(id=>({id,unit:stored73G.units[id]||'',vehicle:stored73G.vehicles[id]||'',states:{}}))});
let data;try{const raw=JSON.parse(localStorage.getItem(KEY));data=raw&&Array.isArray(raw.cars)&&Array.isArray(raw.projects)?raw:defaultData()}catch{data=defaultData()}
data.history=Array.isArray(data.history)?data.history:[];
for(const c of data.cars){if(!c.unit&&stored73G.units[c.id])c.unit=stored73G.units[c.id];if(!c.vehicle&&stored73G.vehicles[c.id])c.vehicle=stored73G.vehicles[c.id]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('瀏覽器儲存失敗，請嘗試備份資料。')}}
// 統計與表格共用同一組篩選條件，避免選取單位後數字仍是全車廂。
const selectedCars=new Set();
function matchesFilters(c){
 const q=$('search').value.trim().toLowerCase();
 const unit=$('unitFilter').value;
 const completed=data.projects.length>0&&data.projects.every(p=>c.states[p]==='done');
 const item=$('itemFilter').value, itemState=$('itemStatusFilter').value;
 const state=item==='all'?'':(c.states[item]||'');
 const itemOk=item==='all'||itemState==='all'||(itemState==='pending'?state!=='done':itemState==='empty'?state==='':state===itemState);
 return itemOk&&(!q||[c.id,c.unit,c.vehicle].join(' ').toLowerCase().includes(q))
   &&(unit==='all'||c.unit===unit)
;
}
function filteredCars(){return data.cars.filter(matchesFilters)}
function stats(){
 const cars=filteredCars(),total=cars.length;
 const completed=cars.filter(c=>data.projects.length>0&&data.projects.every(p=>c.states[p]==='done')).length;
 let all=0,ok=0;
 for(const c of cars)for(const p of data.projects){all++;if(c.states[p]==='done')ok++}
 $('total').textContent=total;
 $('done').textContent=completed;
 $('todo').textContent=total-completed;
 $('rate').textContent=all?Math.round(ok/all*100)+'%':'—';
 if(typeof renderProjectSummary==='function')renderProjectSummary(cars);
}
function renderHead(){
  // 左側識別欄固定像素寬度；更新欄只使用剩餘空間，新增後不會擠壓左側。
  const left=[55,125,185,155],projectMin=180,overallMin=165;
  const count=data.projects.length;
  const container=$('progressTable').parentElement;
  const available=Math.max(0,container.clientWidth-17);
  const reserved=left.reduce((a,b)=>a+b,0)+overallMin;
  const projectTotal=count*projectMin;
  const widths=[...left,...data.projects.map(()=>projectMin),overallMin];
  const total=widths.reduce((a,b)=>a+b,0);
  $('columnWidths').innerHTML=widths.map(w=>`<col style="width:${w}px">`).join('');
  $('progressTable').style.width=total+'px';
  $('thead').innerHTML='<tr><th class="identity-head">#<small>選取</small></th><th class="identity-head">單位<small>Unit</small></th><th class="identity-head">車號<small>Vehicle No.</small></th><th class="identity-head">車廂編號<small>Carriage No.</small></th>'+
  data.projects.map((p,i)=>`<th class="project-column"><div class="project-head"><span class="project-title" title="${esc(p)}">${esc(p)}<small>Update Status</small></span><button type="button" data-remove="${i}" title="刪除項目：${esc(p)}" aria-label="刪除 ${esc(p)}">×</button></div></th>`).join('')+
  '<th class="overall-head">車廂進度<small>Overall</small></th></tr>';
}

function vehicleOptions(current){
 const items=[...new Set([...VEHICLE_OPTIONS,...(data.customVehicles||[]),...data.cars.map(c=>c.vehicle).filter(Boolean)])];
 return '<option value="">選擇車號</option>'+items.map(v=>`<option value="${esc(v)}" ${current===v?'selected':''}>${esc(v)}</option>`).join('')+'<option value="__custom__">＋ 手動新增車號…</option>';
}
function stateButton(state){return `<button type="button" class="state ${state==='done'?'done':state==='no'?'no':''}" data-state-button aria-label="${state==='done'?'已完成，點選切換未完成':state==='no'?'未完成，點選切換未記錄':'未記錄，點選切換已完成'}"><span class="state-icon" aria-hidden="true">${state==='done'?'✓':state==='no'?'✕':'—'}</span><span>${state==='done'?'已完成':state==='no'?'未完成':'未記錄'}</span></button>`}
function renderBody(){const q=$('search').value.trim().toLowerCase(),unitFilter=$('unitFilter').value;let buf='';data.cars.forEach((c,i)=>{const completed=data.projects.length>0&&data.projects.every(p=>c.states[p]==='done');if(!matchesFilters(c))return;buf+=`<tr data-index="${i}"><td class="num"><label class="row-check"><input class="car-check" type="checkbox" data-car-id="${esc(c.id)}" ${selectedCars.has(c.id)?'checked':''}><span>${i+1}</span></label></td><td><select data-field="unit"><option value="">選擇單位</option>${UNIT_OPTIONS.map(u=>`<option value="${esc(u)}" ${c.unit===u?'selected':''}>${esc(u)}</option>`).join('')}</select></td><td><select class="vehicle-select" data-field="vehicle">${vehicleOptions(c.vehicle)}</select></td><td class="car"><b>${esc(c.id)}</b></td>${data.projects.map((p,j)=>`<td class="status" data-project="${j}">${stateButton(c.states[p]||'')}</td>`).join('')}<td class="status"><span class="state overall ${completed?'done':''}"><span class="state-icon">${completed?'✓':'—'}</span>${completed?'全部完成':'尚未完成'}</span></td></tr>`});$('tbody').innerHTML=buf||'<tr><td colspan="'+(5+data.projects.length)+'" style="text-align:center;padding:32px;color:#8495ac">沒有符合條件的車廂</td></tr>'}
function refreshUnits(){const el=$('unitFilter'),before=el.value;const items=[...new Set([...UNIT_OPTIONS,...data.cars.map(c=>c.unit).filter(Boolean)])];el.innerHTML='<option value="all">全部單位 / All Units</option>'+items.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('');el.value=items.includes(before)?before:'all'}
function render(){refreshUnits();renderHead();renderBody();stats()}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2200)}
$('vehicle-list').innerHTML=VEHICLE_OPTIONS.map(v=>`<option value="${esc(v)}"></option>`).join('');
$('tbody').addEventListener('click',e=>{const b=e.target.closest('[data-state-button]');if(!b)return;const tr=b.closest('tr'),td=b.closest('[data-project]');const car=data.cars[+tr.dataset.index],key=data.projects[+td.dataset.project];car.states[key]=car.states[key]==='done'?'no':car.states[key]==='no'?'':'done';save();renderBody();stats()});
$('tbody').addEventListener('change',e=>{const el=e.target.closest('[data-field]');if(!el)return;const car=data.cars[+el.closest('tr').dataset.index];let value=el.value;
 if(el.dataset.field==='vehicle'&&value==='__custom__'){
   const added=prompt('請輸入新車號（新增後可於所有車廂選單中使用）');
   if(added===null||!added.trim()){renderBody();return}
   value=added.trim();data.customVehicles=data.customVehicles||[];
   if(!VEHICLE_OPTIONS.includes(value)&&!data.customVehicles.includes(value))data.customVehicles.push(value);
 }
 car[el.dataset.field]=value;save();refreshUnits();renderBody();stats()});
$('thead').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;let i=+b.dataset.remove,p=data.projects[i];if(!confirm(`確定刪除「${p}」項目？該項目的完成狀態也會移除。`))return;data.projects.splice(i,1);for(const c of data.cars)delete c.states[p];save();render();toast('已刪除項目')});
$('import73g').onclick=()=>$('source73g').click();
$('source73g').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||(!obj.units&&!obj.vehicleNumbers&&!obj.vehicleNos&&!Array.isArray(obj.records)))throw Error('不是有效的 73G JSON 備份');const units=obj.units||{},vehicles=obj.vehicleNumbers||obj.vehicleNos||{};for(const r of obj.records||[]){if(!r||!r.car)continue;if(r.unit&&!units[r.car])units[r.car]=r.unit;if((r.vehicleNo||r.vehicle_no)&&!vehicles[r.car])vehicles[r.car]=r.vehicleNo||r.vehicle_no}let found=0;for(const c of data.cars){if(units[c.id]||vehicles[c.id])found++}if(!found){alert('備份中找不到可配對的車廂資料');return}if(!confirm(`找到 ${found} 個車廂的單位或車號配對。匯入後將更新這些車廂的配對，但不會更動更新進度，確定繼續？`))return;for(const c of data.cars){if(units[c.id])c.unit=String(units[c.id]);if(vehicles[c.id])c.vehicle=String(vehicles[c.id])}save();render();toast(`已匯入 ${found} 個車廂的配對資料`)}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
$('addProject').onclick=()=>{let p=prompt('輸入新項目名稱（例如：韌體更新）');if(p===null)return;p=p.trim();if(!p)return alert('請輸入項目名稱');if(data.projects.includes(p))return alert('這個項目已存在');if(data.projects.length>=25)return alert('最多 25 個項目');data.projects.push(p);save();render();toast('已新增：'+p)};
$('addCar').onclick=()=>{let id=prompt('輸入新車廂編號');if(id===null)return;id=id.trim();if(!id)return;if(data.cars.some(c=>c.id===id))return alert('車廂已存在');data.cars.push({id,unit:'',vehicle:'',states:{}});save();render();toast('已新增車廂')};
window.addEventListener('resize',()=>renderHead());$('search').oninput=()=>{renderBody();stats()};$('unitFilter').onchange=()=>{renderBody();stats()};
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff',text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$('downloadCsv').onclick=()=>{const csv=[['單位','車號','車廂編號',...data.projects,'車廂進度'],...data.cars.map(c=>[c.unit,c.vehicle,c.id,...data.projects.map(p=>c.states[p]==='done'?'已完成':c.states[p]==='no'?'未完成':'未記錄'),data.projects.length&&data.projects.every(p=>c.states[p]==='done')?'全部完成':'尚未完成'])].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('CN車廂更新進度.csv',csv,'text/csv;charset=utf-8')};
$('downloadJson').onclick=()=>download('CN車廂更新紀錄備份.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');$('uploadJson').onclick=()=>$('file').click();
$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!Array.isArray(x.projects)||!Array.isArray(x.cars)||!x.projects.every(p=>typeof p==='string')||!x.cars.every(c=>c&&typeof c.id==='string'&&typeof c.states==='object'&&c.states!==null))throw Error('格式錯誤');if(!confirm('匯入備份將覆蓋目前的全部車廂狀態，確定繼續？'))return;data={projects:x.projects,customVehicles:Array.isArray(x.customVehicles)?x.customVehicles:[],history:Array.isArray(x.history)?x.history:[],cars:x.cars.map(c=>({id:c.id,unit:String(c.unit||''),vehicle:String(c.vehicle||''),states:c.states}))};save();render();toast('已匯入備份')}catch(err){alert('無法匯入：'+err.message)}finally{e.target.value=''}};
render();
</script>
<script>
/* Responsive table labels, without save or undo popups. */
(function(){
 const oldRenderBody=renderBody;
 renderBody=function(){
   oldRenderBody();
   document.querySelectorAll('#tbody tr[data-index]').forEach(tr=>{
     const tds=tr.querySelectorAll(':scope > td');
     const fixed=['編號','單位','車號','車廂編號'];
     tds.forEach((td,j)=>td.dataset.label=j<4?fixed[j]:j===tds.length-1?'車廂進度':data.projects[j-4]||'更新項目');
   });
 };
 renderBody();
})();
</script>
<script>

function addHistory(car,project,previous,next,source){
 if(previous===next)return;
 data.history.push({time:new Date().toISOString(),car,project,from:previous||'',to:next||'',source});
 if(data.history.length>3000)data.history.splice(0,data.history.length-3000);
}
function stateName(s){return s==='done'?'已完成':s==='no'?'未完成':'未記錄'}
function renderProjectSummary(cars){
 $('projectSummary').innerHTML=data.projects.map(p=>{
  const complete=cars.filter(c=>(c.states[p]||'')==='done').length;
  const percent=cars.length?Math.round(complete/cars.length*100):0;
  return `<div class="project-card"><div class="project-line"><strong title="${esc(p)}">${esc(p)}</strong><span>${complete} / ${cars.length} 台 <b>${percent}%</b></span></div><div class="progress-track"><div style="width:${percent}%"></div></div></div>`;
 }).join('')||'<span class="empty-summary">尚未建立更新項目</span>';
}
function refreshProjectFilter(){
 const select=$('itemFilter'),old=select.value;
 select.innerHTML='<option value="all">全部更新項目</option>'+data.projects.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
 select.value=data.projects.includes(old)?old:'all';
 const batch=$('batchProject'),prev=batch.value;
 batch.innerHTML=data.projects.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
 if(data.projects.includes(prev))batch.value=prev;
 $('applyBatch').disabled=!data.projects.length;
}
function updateSelection(){
 const visible=filteredCars(),ids=new Set(visible.map(c=>c.id));
 const count=[...selectedCars].filter(id=>data.cars.some(c=>c.id===id)).length;
 $('selectedCount').textContent=`已選 ${count} 台`;
 $('selectAllVisible').checked=visible.length>0&&visible.every(c=>selectedCars.has(c.id));
 $('selectAllVisible').indeterminate=visible.some(c=>selectedCars.has(c.id))&&!$('selectAllVisible').checked;
 $('applyBatch').disabled=count===0||!data.projects.length;
}
function historyCsv(){
 const rows=[['時間','車廂編號','更新項目','原狀態','新狀態','操作'],...data.history.map(h=>[new Date(h.time).toLocaleString('zh-TW'),h.car,h.project,stateName(h.from),stateName(h.to),h.source])];
 return rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
}
function showHistory(){
 $('historyList').innerHTML=data.history.length?data.history.slice().reverse().slice(0,300).map(h=>`<div class="history-entry"><time>${esc(new Date(h.time).toLocaleString('zh-TW'))}</time><strong>${esc(h.car)}</strong><span>${esc(h.project)}</span><span>${stateName(h.from)} → <b>${stateName(h.to)}</b></span><small>${esc(h.source)}</small></div>`).join(''):'<p>目前沒有操作紀錄</p>';
 $('historyDialog').showModal();
}
$('historyBtn').addEventListener('click',showHistory);
$('closeHistory').onclick=()=>$('historyDialog').close();
$('exportHistory').onclick=()=>download('CN操作歷史紀錄.csv',historyCsv(),'text/csv;charset=utf-8');
$('tbody').addEventListener('click',e=>{
 const button=e.target.closest('[data-state-button]');if(!button)return;
 const tr=button.closest('tr'),td=button.closest('[data-project]');if(!tr||!td)return;
 const car=data.cars[Number(tr.dataset.index)],project=data.projects[Number(td.dataset.project)];
 const old=car.states[project]||'',next=old==='done'?'no':old==='no'?'':'done';
 addHistory(car.id,project,old,next,'單筆更新');
},true);
$('tbody').addEventListener('change',e=>{
 const cb=e.target.closest('.car-check');if(!cb)return;
 cb.checked?selectedCars.add(cb.dataset.carId):selectedCars.delete(cb.dataset.carId);
 updateSelection();
});
$('selectAllVisible').onchange=e=>{
 filteredCars().forEach(c=>e.target.checked?selectedCars.add(c.id):selectedCars.delete(c.id));
 renderBody();updateSelection();
};
$('clearSelection').onclick=()=>{selectedCars.clear();renderBody();updateSelection()};
$('applyBatch').onclick=()=>{
 const project=$('batchProject').value,next=$('batchStatus').value;
 const cars=data.cars.filter(c=>selectedCars.has(c.id));
 if(!cars.length||!data.projects.includes(project))return;
 const changes=cars.filter(c=>(c.states[project]||'')!==next);
 if(!changes.length)return;
 if(!confirm(`確定將 ${changes.length} 台車廂的「${project}」設定為「${stateName(next)}」？\n此操作會寫入歷史紀錄。`))return;
 for(const c of changes){addHistory(c.id,project,c.states[project]||'',next,'批次更新');c.states[project]=next;}
 save();renderBody();stats();updateSelection();toast(`已批次更新 ${changes.length} 台車廂`);
};
$('itemFilter').onchange=()=>{renderBody();stats();updateSelection()};
$('itemStatusFilter').onchange=()=>{renderBody();stats();updateSelection()};
$('densityToggle').onclick=()=>{
 const compact=document.body.classList.toggle('compact-density');
 $('densityToggle').textContent=compact?'一般模式':'緊湊模式';
 try{localStorage.setItem('cn_density_pref',compact?'compact':'normal')}catch{}
};
if((()=>{try{return localStorage.getItem('cn_density_pref')==='compact'}catch{return false}})()){
 document.body.classList.add('compact-density');$('densityToggle').textContent='一般模式';
}
// Enhance existing rendering without changing the data model or existing storage key.
const baselineRender=render;
render=function(){refreshProjectFilter();baselineRender();updateSelection()};
const baselineBody=renderBody;
renderBody=function(){baselineBody();updateSelection()};
const originalCsvClick=$('downloadCsv').onclick;
$('downloadCsv').onclick=()=>{
 const choice=confirm('是否只匯出目前篩選結果？\n「確定」＝僅匯出目前篩選車廂\n「取消」＝匯出全部車廂');
 if(!choice)return originalCsvClick();
 const rows=[['單位','車號','車廂編號',...data.projects,'車廂進度'],...filteredCars().map(c=>[c.unit,c.vehicle,c.id,...data.projects.map(p=>stateName(c.states[p]||'')),data.projects.length&&data.projects.every(p=>c.states[p]==='done')?'全部完成':'尚未完成'])];
 const csv=rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 download('CN車廂更新進度_篩選結果.csv',csv,'text/csv;charset=utf-8');
};
// Original backup imports the core data fields only. Restore optional history from the JSON backup.
refreshProjectFilter();render();

</script></body></html>
